name: Mac canary

# Proves both self-hosted lanes take work. Never triggered by pull requests. Runs daily so a
# broken host is noticed before a release needs it; the scheduled run skips the release lane,
# which would otherwise sit waiting for a reviewer.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  build:
    name: mac-build (fresh VM)
    runs-on: [self-hosted, macOS, ARM64, mac-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Environment
        run: |
          sw_vers
          uname -m
          whoami
          xcodebuild -version
          echo "runner: $RUNNER_NAME"

  release:
    name: mac-release (fresh VM with the signing share)
    runs-on: [self-hosted, macOS, ARM64, mac-release]
    environment: release   # waits for a reviewer, like a real release
    if: github.event_name != 'schedule'
    steps:
      - name: Environment
        run: |
          sw_vers
          uname -m
          whoami
          echo "runner: $RUNNER_NAME"
          echo "signing share:"; ls -la "/Volumes/My Shared Files/signing" || echo "(not mounted)"
