name: Mac canary

# Proves both self-hosted lanes take work. Manual only; never triggered by pull requests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: mac-build (fresh VM)
    runs-on: [self-hosted, macOS, ARM64, mac-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Environment
        run: |
          sw_vers
          uname -m
          whoami
          xcodebuild -version
          echo "runner: $RUNNER_NAME"

  release:
    name: mac-release (fresh VM with the signing share)
    runs-on: [self-hosted, macOS, ARM64, mac-release]
    steps:
      - name: Environment
        run: |
          sw_vers
          uname -m
          whoami
          echo "runner: $RUNNER_NAME"
          echo "signing share:"; ls -la "/Volumes/My Shared Files/signing" || echo "(not mounted)"
