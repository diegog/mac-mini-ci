name: Release

# Signs and notarizes a build on the mac-release lane. The job waits for a reviewer (the
# `release` environment), then runs in a fresh VM that has the signing directory mounted read-only.
# This repository has nothing of its own to ship, so it signs a sample program; copy the steps.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: sign and notarize
    runs-on: [self-hosted, macOS, ARM64, mac-release]
    environment: release
    env:
      SIGNING_DIR: /Volumes/My Shared Files/signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Build
        run: |
          mkdir -p build
          clang -O2 -o build/hello examples/hello/main.c
          file build/hello

      - name: Import the signing identity into a throwaway keychain
        env:
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"   # later steps use it too
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$SIGNING_DIR/developer-id.p12" -P "$P12_PASSWORD" -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Sign
        run: |
          codesign --force --timestamp --options runtime \
            --sign "${{ vars.SIGNING_IDENTITY }}" --keychain "$KEYCHAIN" build/hello
          codesign --verify --strict --verbose=2 build/hello
          codesign --display --verbose=2 build/hello 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp)'

      # The signed build is kept before notarization: Apple's queue occasionally takes longer
      # than any sane timeout, and the ticket it eventually issues is bound to this exact file.
      - name: Upload the signed build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hello-signed
          path: build/hello

      - name: Notarize
        run: |
          ditto -c -k --keepParent build/hello build/hello.zip
          xcrun notarytool submit build/hello.zip \
            --key "$SIGNING_DIR/AuthKey.p8" \
            --key-id "${{ vars.NOTARY_KEY_ID }}" \
            --issuer "${{ vars.NOTARY_ISSUER_ID }}" \
            --wait --timeout 60m
          # A bare executable cannot be stapled (that needs an .app, .pkg or .dmg); Gatekeeper
          # fetches the ticket online. Real bundles: `xcrun stapler staple <bundle>` here.

      - name: Upload the notarized build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hello-notarized
          path: build/hello.zip

      - name: Forget the keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
